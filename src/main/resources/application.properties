quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
quarkus.datasource.username=sa
quarkus.datasource.password=
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql=true
# Listen on all interfaces (0.0.0.0) so peers on your network can connect
quarkus.http.host=0.0.0.0

# Choose any unused port (e.g., 8081). Default is 8080.
quarkus.http.port=8081

# (Optional) Enable HTTP/2 if desired
quarkus.http.http2=true

# (Optional) Disable SSL for simple local testing
quarkus.ssl.native=false